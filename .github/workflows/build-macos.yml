name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests nuitka ordered-set
      
      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --macos-create-app-bundle \
            --include-data-file=icon.png=icon.png \
            --include-data-file=weixin.png=weixin.png \
            --output-filename=CodeManager_v9_6 \
            --company-name="LZF" \
            --product-name="Code Manager" \
            --file-version=9.6.0 \
            --product-version=9.6.0 \
            --enable-plugin=tk-inter \
            --nofollow-import-to=test_release \
            --assume-yes-for-downloads \
            github_manager_v9.6.py
      
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: CodeManager-macOS
          path: |
            CodeManager_v9_6.app
            CodeManager_v9_6.dist/
            CodeManager_v9_6
      
      - name: Create Release (if tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            CodeManager_v9_6.app
            CodeManager_v9_6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
